name: Build & Sign Android APK

# Compile, build and sign the AndroHunter APK from source.
# Produces a signed, installable release APK as a workflow artifact
# (and attaches it to a GitHub Release when a v* tag is pushed).
#
# Two signing modes:
#   1. Release keystore from repo secrets (if configured — see below)
#   2. Auto-generated CI keystore fallback (no secrets needed)
#
# Secrets (Settings → Secrets and variables → Actions):
#   ANDROID_KEYSTORE_BASE64    base64 of the .keystore file (keystore/keystore-base64.txt)
#   ANDROID_KEYSTORE_PASSWORD  keystore password
#   ANDROID_KEY_ALIAS          key alias
#   ANDROID_KEY_PASSWORD       key password

on:
  push:
    branches: [ main, master ]
    tags: [ 'v*' ]
  workflow_dispatch:

permissions:
  contents: write   # needed only to attach APKs to releases on tag push

concurrency:
  group: build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: Compile, Build & Sign APK
    runs-on: ubuntu-latest

    env:
      KEYSTORE_BASE64:   ${{ secrets.ANDROID_KEYSTORE_BASE64 }}
      KEYSTORE_PASSWORD: ${{ secrets.ANDROID_KEYSTORE_PASSWORD }}
      KEY_ALIAS:         ${{ secrets.ANDROID_KEY_ALIAS }}
      KEY_PASSWORD:      ${{ secrets.ANDROID_KEY_PASSWORD }}

    steps:
      - name: Checkout source
        uses: actions/checkout@v4

      - name: Set up JDK 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '17'

      - name: Set up Gradle (with build cache)
        uses: gradle/actions/setup-gradle@v4

      # local.properties points to a machine-specific SDK path; the runner
      # already has ANDROID_HOME set, so it must not override it.
      - name: Remove local.properties
        run: rm -f local.properties

      - name: Grant execute permission for gradlew
        run: chmod +x gradlew

      - name: Compile & build release APK
        run: ./gradlew assembleRelease --stacktrace

      # ── Resolve signing keystore ────────────────────────────────
      - name: Decode release keystore from secrets
        if: env.KEYSTORE_BASE64 != ''
        run: |
          echo "$KEYSTORE_BASE64" | base64 -d > signing.keystore
          echo "KEYSTORE_FILE=signing.keystore" >> "$GITHUB_ENV"

      - name: Generate CI signing keystore (fallback, no secrets configured)
        if: env.KEYSTORE_BASE64 == ''
        run: |
          keytool -genkeypair -v \
            -keystore signing.keystore -storetype PKCS12 \
            -alias androhunter -keyalg RSA -keysize 2048 -validity 10000 \
            -storepass AndroHunterCI -keypass AndroHunterCI \
            -dname "CN=AndroHunter CI, OU=Security, O=AndroHunter, C=US"
          {
            echo "KEYSTORE_FILE=signing.keystore"
            echo "KEYSTORE_PASSWORD=AndroHunterCI"
            echo "KEY_ALIAS=androhunter"
            echo "KEY_PASSWORD=AndroHunterCI"
          } >> "$GITHUB_ENV"

      # ── zipalign + sign ─────────────────────────────────────────
      - name: Locate Android build-tools
        run: echo "BT_DIR=$(ls -d "$ANDROID_HOME"/build-tools/* | sort -V | tail -n1)" >> "$GITHUB_ENV"

      - name: zipalign APK
        run: |
          "$BT_DIR/zipalign" -f -p 4 \
            app/build/outputs/apk/release/app-release-unsigned.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Sign APK with apksigner
        run: |
          "$BT_DIR/apksigner" sign \
            --ks "$KEYSTORE_FILE" \
            --ks-key-alias "$KEY_ALIAS" \
            --ks-pass "pass:$KEYSTORE_PASSWORD" \
            --key-pass "pass:$KEY_PASSWORD" \
            --out AndroHunter-signed.apk \
            app/build/outputs/apk/release/app-release-aligned.apk

      - name: Verify signature
        run: |
          "$BT_DIR/apksigner" verify --print-certs AndroHunter-signed.apk

      # ── Publish ─────────────────────────────────────────────────
      - name: SHA-256 checksum & job summary
        run: |
          SHA=$(sha256sum AndroHunter-signed.apk | awk '{print $1}')
          echo "SHA256: $SHA" > AndroHunter-signed.apk.sha256
          {
            echo "## Build result"
            echo "- APK: \`AndroHunter-signed.apk\`"
            echo "- SHA-256: \`$SHA\`"
            echo "- Signing mode: ${{ env.KEYSTORE_BASE64 != '' && 'release keystore (secrets)' || 'CI-generated keystore (fallback)' }}"
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Upload signed APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: AndroHunter-signed-apk-r${{ github.run_number }}
          path: |
            AndroHunter-signed.apk
            AndroHunter-signed.apk.sha256
          if-no-files-found: error

      - name: Attach APK to GitHub Release (tag pushes only)
        if: startsWith(github.ref, 'refs/tags/')
        uses: softprops/action-gh-release@v2
        with:
          files: |
            AndroHunter-signed.apk
            AndroHunter-signed.apk.sha256
